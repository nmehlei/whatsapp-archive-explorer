name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: ci/check-no-private-data.sh
      - run: dotnet test whatsapp-archive-explorer.slnx -c Release -p:SkipWeb=true
      - run: npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test
        working-directory: src/web

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: osx-x64, os: macos-latest, archive: tar.gz }
          - { rid: osx-arm64, os: macos-latest, archive: tar.gz }
          - { rid: linux-x64, os: ubuntu-latest, archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest, archive: tar.gz }
          - { rid: win-x64, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Version (GitVersion 5, Mainline)
        id: version
        shell: bash
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          echo "semver=$(dotnet-gitversion /showvariable SemVer)" >> "$GITHUB_OUTPUT"
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Explorer -c Release -r ${{ matrix.rid }} -o out \
            -p:Version=${{ steps.version.outputs.semver }} -p:InformationalVersion=${{ steps.version.outputs.semver }}
          cp LICENSE README.md out/
      - name: Package
        shell: bash
        run: |
          name=whatsapp-archive-explorer-${{ steps.version.outputs.semver }}-${{ matrix.rid }}
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" ./out/* > /dev/null
          else
            tar -czf "$name.tar.gz" -C out .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.rid }}
          path: whatsapp-archive-explorer-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum whatsapp-archive-explorer-* > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/whatsapp-archive-explorer-*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
