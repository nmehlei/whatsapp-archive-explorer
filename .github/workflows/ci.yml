name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ci/check-no-private-data.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test whatsapp-archive-explorer.slnx -c Release -p:SkipWeb=true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: src/web
      - run: dotnet publish src/Explorer -c Release -r linux-x64 -o artifacts/linux-x64
      - run: npx playwright install --with-deps chromium
        working-directory: src/web
      - run: npm run e2e
        working-directory: src/web
        env:
          CI: "1"
          EXPLORER_BIN: ${{ github.workspace }}/artifacts/linux-x64/whatsapp-archive-explorer
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: src/web/playwright-report
          retention-days: 7
