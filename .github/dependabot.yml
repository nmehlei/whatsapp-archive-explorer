version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # typescript-eslint (via eslint-config-next) supports TypeScript < 6.1 only; lift once it supports 7
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
